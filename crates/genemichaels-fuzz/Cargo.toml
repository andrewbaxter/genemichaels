[package]
name = "genemichaels-fuzz"
description = "Finds formatter bugs by checking invariants over a corpus of Rust code"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
aargvark = { version = "=0.13.0", path = "../aargvark" }
genemichaels-lib = { path = "../genemichaels-lib" }
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
walkdir = "2"

[lints.clippy]
all = "allow"
